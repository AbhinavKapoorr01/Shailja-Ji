<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shailja ❤️</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  overflow-x:hidden;
  color:white;
}

/* 🌌 Smooth Stars */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:white;opacity:.6;animation:twinkle 4s infinite alternate ease-in-out}
@keyframes twinkle{from{opacity:.2}to{opacity:.9}}

/* 🎬 Intro */
.intro{position:fixed;inset:0;background:black;display:flex;justify-content:center;align-items:center;z-index:10;animation:fadeOut 1.5s ease 1.3s forwards}
.intro h1{font-size:26px;letter-spacing:2px;color:#ff2e63;animation:softGlow 2s infinite alternate}
@keyframes softGlow{from{opacity:.6}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* 💎 Main Card */
.container{
  width:92%;max-width:420px;
  background:rgba(255,255,255,.06);
  border-radius:22px;
  padding:32px 22px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  animation:fadeIn .5s ease;
  z-index:2;
  transition:opacity .4s ease, transform .4s ease;
}

.fade-out{opacity:0;transform:scale(.98)}

h1{font-size:clamp(22px,5vw,28px);margin-bottom:10px;color:#ff2e63}

p{font-size:15px;margin:18px 0 25px;min-height:24px;opacity:.85}

.buttons{display:flex;gap:10px}

button{
  flex:1;border:none;padding:12px;border-radius:18px;font-size:15px;cursor:pointer;
  transition:all .2s ease
}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.96)}

.yes{background:#ff2e63;color:white}
.no{background:transparent;color:#ff9a9e;border:1px solid rgba(255,255,255,.25)}

/* 💖 Popup */
.cute-popup{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;justify-content:center;align-items:center;z-index:20;animation:fadeIn .3s ease}
.popup-box{background:#1a1a1a;padding:30px 25px;border-radius:20px;text-align:center;animation:popSmooth .3s ease;width:90%;max-width:350px}
.popup-box h2{color:#ff2e63;margin-bottom:10px}
.popup-box p{font-size:16px;margin-bottom:15px}

/* 💖 Celebration */
.celebration{position:fixed;inset:0;background:black;display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto;animation:fadeIn .4s ease;z-index:5}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.08);border-radius:22px;padding:28px 20px 40px;text-align:center;animation:popSmooth .35s ease}
.names{margin:10px 0 15px;font-weight:bold;color:#ffd6e0}

.share-btn{
  margin-top:12px;width:100%;background:#ff2e63;color:white;border-radius:18px;
  animation:glowPulse 2s infinite alternate
}

@keyframes glowPulse{from{box-shadow:0 0 8px rgba(255,46,99,.4)}to{box-shadow:0 0 20px rgba(255,46,99,.9)}}

img{width:100%;margin-top:12px;border-radius:16px}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes popSmooth{from{transform:scale(.95)}to{transform:scale(1)}}
</style></head>
<body><div class="stars" id="stars"></div><div class="intro"><h1>A Special Question ❤️</h1></div><div class="container" id="proposal">
  <h1>Shailja, Will You Be Mine? ❤️</h1>
  <p id="teaseText">You are my favorite coincidence ✨</p>
  <div class="buttons">
    <button class="yes" onclick="cuteSurprise()">Yes 💖</button>
    <button class="no" id="noBtn" onclick="moveNo(); tease();">No 😜</button>
  </div>
</div><audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b3a1c6b0.mp3?filename=romantic-love-11786.mp3" type="audio/mpeg">
</audio><script>
const noBtn=document.getElementById('noBtn');
const teaseText=document.getElementById('teaseText');
const music=document.getElementById('bgMusic');

const teaseMessages=["Are you sure? 😌","Think again 😏","No button nervous 😜","Destiny says YES 💖"];

function moveNo(){
  const x=Math.random()*(window.innerWidth-noBtn.offsetWidth);
  const y=Math.random()*(window.innerHeight-noBtn.offsetHeight);
  noBtn.style.position='fixed';
  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
}

function tease(){teaseText.innerText=teaseMessages[Math.floor(Math.random()*teaseMessages.length)]}

function fadeMusicIn(){
  music.volume=0;
  music.play();
  let vol=0;
  const fade=setInterval(()=>{
    if(vol<0.6){vol+=0.05;music.volume=vol}else clearInterval(fade)
  },200);
}

function cuteSurprise(){
  fadeMusicIn();
  document.getElementById('proposal').classList.add('fade-out');
  setTimeout(()=>{
    document.body.innerHTML+=`
    <div class="cute-popup">
      <div class="popup-box">
        <h2>Waitttt 🥺💖</h2>
        <p>You just made my heart do happy dance 😭❤️</p>
        <button class="share-btn" onclick="acceptLove()">Continue 😌</button>
      </div>
    </div>`;
  },300);
}

function acceptLove(){
  document.body.innerHTML=`
  <div class="celebration">
    <div class="card">
      <h2>💖 She Said YES 💖</h2>
      <div class="names">Abhinav ❤️ Shailja</div>
      <p>Forever officially begins ✨</p>
      <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7" />
      <button class="share-btn" onclick="shareWhatsApp()">Share with Abhinav 💖</button>
    </div>
  </div>`;
}

function shareWhatsApp(){
  const text=encodeURIComponent("She Said YES 💖\nAbhinav ❤️ Shailja\nForever officially begins ✨");
  window.open(`https://wa.me/?text=${text}`,'_blank');
}

/* Stars */
const stars=document.getElementById('stars');
for(let i=0;i<30;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  s.style.animationDelay=Math.random()*3+'s';
  stars.appendChild(s);
}
</script></body>
</html>
